name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  type-check:
    name: Type Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch OpenAPI specs from production
        env:
          DW_PLATFORM_KEY: ${{ secrets.DW_PLATFORM_KEY }}
        run: |
          # Sanity-check the secret is actually set. Empty secret would cause
          # the Authorization header to be `Bearer ` and curl would get a 401
          # with no useful error message in the CI log.
          if [ -z "$DW_PLATFORM_KEY" ]; then
            echo "::error::DW_PLATFORM_KEY secret is empty or unset."
            echo "Check the secret at:"
            echo "  https://github.com/$GITHUB_REPOSITORY/settings/secrets/actions"
            echo "It must be set under 'Secrets and variables -> Actions' (not Dependabot/Codespaces)."
            exit 1
          fi
          echo "DW_PLATFORM_KEY is set (length: ${#DW_PLATFORM_KEY})."

          # Fetch the two OpenAPI specs. Print HTTP status on failure so the
          # CI log makes the cause obvious (401 = key invalid/expired,
          # 403 = key lacks scope, 404 = endpoint moved, etc.).
          fetch_spec() {
            local url="$1"
            local out="$2"
            local status
            status=$(curl -s -o "$out" -w '%{http_code}' \
              -H "Authorization: Bearer $DW_PLATFORM_KEY" "$url")
            if [ "$status" != "200" ]; then
              echo "::error::Fetch failed for $url (HTTP $status)"
              echo "First 200 chars of response body:"
              head -c 200 "$out" || true
              echo ""
              return 1
            fi
            echo "Fetched $url ($(wc -c < "$out") bytes)"
          }
          fetch_spec https://app.doubleword.ai/ai/openapi.json    /tmp/ai-openapi.json
          fetch_spec https://app.doubleword.ai/admin/openapi.json /tmp/admin-openapi.json
      - name: Validate types against AI OpenAPI spec
        run: python3 scripts/validate-types.py --spec-file /tmp/ai-openapi.json --surface ai
      - name: Validate types against Admin OpenAPI spec
        run: python3 scripts/validate-types.py --spec-file /tmp/admin-openapi.json --surface admin
