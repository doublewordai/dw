name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # The Rust jobs run on every OS we ship a binary for, so the platform-specific
  # code in commands/update.rs is covered. fail-fast is off so that a failure on
  # one OS still lets the other report.
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  fmt:
    name: Format (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  type-check:
    name: Type Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch OpenAPI specs from production
        env:
          DW_PLATFORM_KEY: ${{ secrets.DW_PLATFORM_KEY }}
        run: |
          # Sanity-check the secret is actually set. Empty secret would cause
          # the Authorization header to be `Bearer ` and curl would get a 401
          # with no useful error message in the CI log.
          if [ -z "$DW_PLATFORM_KEY" ]; then
            echo "::error::DW_PLATFORM_KEY secret is empty or unset."
            echo "Check the secret at:"
            echo "  https://github.com/$GITHUB_REPOSITORY/settings/secrets/actions"
            echo "It must be set under 'Secrets and variables -> Actions' (not Dependabot/Codespaces)."
            exit 1
          fi
          # Defence-in-depth: explicitly add the key to the runner's mask
          # list so any accidental future echo of it gets redacted, even if
          # GitHub's automatic masking misses a transformed/encoded form.
          echo "::add-mask::$DW_PLATFORM_KEY"
          echo "DW_PLATFORM_KEY is set (length: ${#DW_PLATFORM_KEY})."

          # Fetch the two OpenAPI specs. Print HTTP status on failure so the
          # CI log makes the cause obvious (401 = key invalid/expired,
          # 403 = key lacks scope, 404 = endpoint moved, etc.).
          fetch_spec() {
            local url="$1"
            local out="$2"
            local status
            local curl_rc=0
            # -sS keeps curl quiet on success but prints transport-layer
            # errors (DNS, TLS, connection refused, etc.) to stderr.
            # Capture curl's exit code explicitly so set -e doesn't kill
            # the step before our non-200 handler runs.
            status=$(curl -sS -o "$out" -w '%{http_code}' \
              -H "Authorization: Bearer $DW_PLATFORM_KEY" "$url") || curl_rc=$?
            if [ "$curl_rc" -ne 0 ]; then
              echo "::error::curl transport failure for $url (exit $curl_rc)"
              return 1
            fi
            if [ "$status" != "200" ]; then
              echo "::error::Fetch failed for $url (HTTP $status)"
              # Prefix each response-body line so any GitHub Actions workflow
              # command (e.g. `::error::`) in the upstream response can't be
              # interpreted as a runner command (log-command injection).
              echo "First 200 chars of response body:"
              head -c 200 "$out" 2>/dev/null | sed 's/^/[body] /' || true
              echo ""
              return 1
            fi
            echo "Fetched $url ($(wc -c < "$out") bytes)"
          }
          fetch_spec https://app.doubleword.ai/ai/openapi.json    /tmp/ai-openapi.json
          fetch_spec https://app.doubleword.ai/admin/openapi.json /tmp/admin-openapi.json
      - name: Validate types against AI OpenAPI spec
        run: python3 scripts/validate-types.py --spec-file /tmp/ai-openapi.json --surface ai
      - name: Validate types against Admin OpenAPI spec
        run: python3 scripts/validate-types.py --spec-file /tmp/admin-openapi.json --surface admin
