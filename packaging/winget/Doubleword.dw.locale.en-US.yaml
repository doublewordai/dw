ShortDescription: Command-line tool for the Doubleword batch inference platform.
Description: |-
  dw is the command-line tool for the Doubleword batch inference platform. Upload JSONL files,
  run batches, stream results, and send real-time inference requests, all from the terminal.

  It replaces curl commands and custom scripts with a single tool for managing files, running
  batches, and sending inference requests. Built for developers who interact with the API
  directly, scripts that automate batch workflows, and AI agents building data pipelines.

  Runs natively in PowerShell, CMD, or a bash shell. WSL is not required. The dw project
  subcommand executes its steps through sh, so it needs Git Bash, WSL, or MSYS2.
