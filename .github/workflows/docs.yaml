name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install mdBook
        run: |
          version="v0.4.43"
          expected_sha="d20c2f20eb1c117dc5ebeec120e2d2f6455c90fe8b4f21b7466625d8b67b9e60"
          archive="mdbook-${version}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSL -o "$archive" "https://github.com/rust-lang/mdBook/releases/download/${version}/${archive}"
          echo "${expected_sha}  ${archive}" | sha256sum -c --strict
          tar -xzf "$archive"
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Build book
        run: mdbook build docs

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: docs/book

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
